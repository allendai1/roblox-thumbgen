[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-thumbgen"
version = "0.1.0"
description = "Personal Roblox thumbnail generator: SDXL LoRA + CTR composition presets"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "pillow>=10",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = [
  "pandas>=2.0",
  "torch>=2.2",
  "transformers>=4.44",
  "open_clip_torch>=2.24",
  "onnxruntime-gpu>=1.17; sys_platform != 'darwin'",
  "onnxruntime>=1.17; sys_platform == 'darwin'",
  "huggingface_hub>=0.24",
  "spandrel>=0.3",
  "einops",
  "timm",
]
app = [
  "torch>=2.2",
  "diffusers>=0.30",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors",
  "peft>=0.12",
  "compel>=2.0",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "python-multipart",
  "huggingface_hub>=0.24",
]
dev = ["pytest>=8"]

[project.scripts]
thumbgen = "thumbgen.cli:main"

[tool.setuptools.packages.find]
include = ["thumbgen*"]
